syntax = "proto3";
import 'nanopb.proto';

message SongDataInternal
{
    repeated uint32 changeLength    = 1 [(nanopb).int_size = IS_8, (nanopb).max_count = 16, (nanopb).fixed_count = true];
    uint32 syncIn                   = 2 [(nanopb).int_size = IS_8];
    uint32 syncOut                  = 3 [(nanopb).int_size = IS_8];
    uint32 bpm                      = 4 [(nanopb).int_size = IS_8];
    uint32 scale                    = 6 [(nanopb).int_size = IS_8];
    uint32 root                     = 7 [(nanopb).int_size = IS_8];
    uint32 delayTime                = 8 [(nanopb).int_size = IS_8];
    uint32 delayFeedback            = 9 [(nanopb).int_size = IS_8];
    uint32 playingPattern           = 10 [(nanopb).int_size = IS_8];
    repeated uint32 patternChain    = 11 [(nanopb).int_size = IS_8, (nanopb).max_count = 16, (nanopb).fixed_count = true];
    uint32 patternChainLength       = 12 [(nanopb).int_size = IS_8];
    uint32 hpVol                     = 13 [(nanopb).int_size = IS_8];
    uint32 swing                     = 14 [(nanopb).int_size = IS_8];
    // optional so that songs written before the reverb had its own controls can be
    // told apart from songs that genuinely store a zero, and fall back to the defaults
    optional uint32 reverbFeedback   = 15 [(nanopb).int_size = IS_8];
    optional uint32 reverbDamping    = 16 [(nanopb).int_size = IS_8];
    optional uint32 reverbModulation = 17 [(nanopb).int_size = IS_8];
    // 18 was reverbLowCap, which used the opposite polarity - left unused so that
    // songs holding it fall through to the reverbLongTail default rather than
    // having their tail length silently flipped
    optional uint32 reverbLongTail   = 19 [(nanopb).int_size = IS_8];
}